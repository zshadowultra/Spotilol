<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Cadence — a music player" />
  <title>Cadence</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <main class="views" id="views">
      <section class="view" id="view-home" data-view="home" aria-label="Home"></section>
      <section class="view" id="view-library" data-view="library" aria-label="Library"></section>
      <section class="view" id="view-search" data-view="search" aria-label="Search"></section>
    </main>

    <!-- full-screen now-playing sheet (covers miniplayer + nav) -->
    <section class="np" id="view-nowplaying" role="dialog" aria-modal="true" aria-label="Now playing">
      <div class="np__bg" id="np-bg" aria-hidden="true"></div>

      <header class="np__head">
        <button class="ctl" id="np-close" aria-label="Close player">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <span class="np__ctx">Now playing</span>
        <span class="np__head-spacer" aria-hidden="true"></span>
      </header>

      <div class="np__stage">
        <div class="np__art" id="np-art" role="img" aria-label="Album artwork"></div>
      </div>

      <div class="np__meta">
        <div class="np__titles">
          <h2 class="np__title" id="np-title">Nothing playing</h2>
          <p class="np__artist" id="np-artist"></p>
        </div>
        <button class="ctl np__like" id="np-like" aria-label="Like">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5S3.6 15.7 3.6 9.9C3.6 7 5.7 4.9 8.3 4.9c1.6 0 3 .8 3.7 2 .7-1.2 2.1-2 3.7-2 2.6 0 4.7 2.1 4.7 5 0 5.8-8.4 10.6-8.4 10.6z"/></svg>
        </button>
      </div>

      <div class="np__seek" id="np-seek" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="np__line">
          <div class="np__fill" id="np-fill"></div>
        </div>
      </div>
      <div class="np__times">
        <span id="np-pos">0:00</span>
        <span id="np-dur">0:00</span>
      </div>

      <div class="np__controls">
        <button class="ctl ctl--ghost" id="np-shuffle" aria-label="Shuffle" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg>
        </button>
        <button class="ctl" id="np-prev" aria-label="Previous track">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M18.6 6.1v11.8L9.6 12z"/><rect x="4.6" y="6.1" width="2.3" height="11.8" rx="1.1"/></svg>
        </button>
        <button class="ctl ctl--play" id="np-toggle" aria-label="Play">
          <svg viewBox="0 0 24 24" width="25" height="25" fill="currentColor" aria-hidden="true"><path d="M8 5.3v13.4L19 12z"/></svg>
        </button>
        <button class="ctl" id="np-next" aria-label="Next track">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M5.4 6.1v11.8L14.4 12z"/><rect x="17.1" y="6.1" width="2.3" height="11.8" rx="1.1"/></svg>
        </button>
        <button class="ctl ctl--ghost" id="np-repeat" aria-label="Repeat" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>
    </section>

    <div class="miniplayer" id="miniplayer">
      <div
        class="miniplayer__progress"
        id="mp-progress"
        role="slider"
        aria-label="Seek"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        tabindex="0"
      >
        <div class="miniplayer__line">
          <div class="miniplayer__fill" id="mp-fill"></div>
        </div>
      </div>

      <button class="miniplayer__body" id="mp-body" aria-label="Open player">
        <span class="miniplayer__art" id="mp-art"></span>
        <span class="miniplayer__meta">
          <span class="miniplayer__title" id="mp-title">Nothing playing</span>
          <span class="miniplayer__artist" id="mp-artist"></span>
        </span>
      </button>

      <div class="miniplayer__controls">
        <button class="ctl" id="mp-like" aria-label="Like">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5S3.6 15.7 3.6 9.9C3.6 7 5.7 4.9 8.3 4.9c1.6 0 3 .8 3.7 2 .7-1.2 2.1-2 3.7-2 2.6 0 4.7 2.1 4.7 5 0 5.8-8.4 10.6-8.4 10.6z"/></svg>
        </button>
        <button class="ctl" id="mp-prev" aria-label="Previous track">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true"><path d="M18.6 6.1v11.8L9.6 12z"/><rect x="4.6" y="6.1" width="2.3" height="11.8" rx="1.1"/></svg>
        </button>
        <button class="ctl ctl--play" id="mp-toggle" aria-label="Play">
          <svg viewBox="0 0 24 24" width="25" height="25" fill="currentColor" aria-hidden="true"><path d="M8 5.3v13.4L19 12z"/></svg>
        </button>
        <button class="ctl" id="mp-next" aria-label="Next track">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true"><path d="M5.4 6.1v11.8L14.4 12z"/><rect x="17.1" y="6.1" width="2.3" height="11.8" rx="1.1"/></svg>
        </button>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Primary">
      <button class="nav-tab active" data-view="home" aria-current="page">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.8 9.8V20h12.4V9.8"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-tab" data-view="library">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="2.5"/><path d="M8.5 20h8a2.5 2.5 0 0 0 2.5-2.5V8.5"/></svg>
        <span>Library</span>
      </button>
      <button class="nav-tab" data-view="search">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20.2 20.2-4.6-4.6"/></svg>
        <span>Search</span>
      </button>
      <button class="nav-tab" data-view="player">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.2"/></svg>
        <span>Player</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
